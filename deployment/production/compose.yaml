name: cicd-production

services:
  api:
    image: ${API_IMAGE}

    environment:
      NODE_ENV: production
      APP_ENV: production
      PORT: 3000

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  web:
    image: ${WEB_IMAGE}

    depends_on:
      api:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:8080/health"
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s