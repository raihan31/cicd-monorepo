name: docker-test

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  WEB_IMAGE: cicd-web
  API_IMAGE: cicd-api

jobs:
  build-images:
    name: Build and smoke-test images
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Angular image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          load: true
          tags: cicd-web:sha-${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build NestJS image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          load: true
          tags: cicd-api:sha-${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Create container network
        run: docker network create ci-network

      - name: Start API container
        run: |
          docker run \
            --detach \
            --name api \
            --network ci-network \
            cicd-api:sha-${GITHUB_SHA}


      - name: Start web container
        run: |
          docker run \
            --detach \
            --name web \
            --network ci-network \
            --publish 8080:8080 \
            cicd-web:sha-${GITHUB_SHA}


      - name: Smoke test containers
        run: |
          curl --fail --retry 20 --retry-delay 2 --retry-all-errors \
            http://localhost:8080/health

          curl --fail --retry 20 --retry-delay 2 --retry-all-errors \
            http://localhost:8080/api/health

          curl --fail --retry 20 --retry-delay 2 --retry-all-errors \
            http://localhost:8080/api/products


      - name: Show container logs
        if: always()
        run: |
          docker logs api || true
          docker logs web || true


      - name: Clean up containers
        if: always()
        run: |
          docker rm --force web api || true
          docker network rm ci-network || true