name: deploy

on:
  workflow_run:
    workflows:
      - docker-publish
    types:
      - completed
    branches:
      - main

  workflow_dispatch:
    inputs:
      image_sha:
        description: Git SHA of the images to deploy
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
    group: deployment-${{ github.event.workflow_run.head_sha }}
    cancel-in-progress: true

env:
    REGISTRY: ghcr.io
    OWNER: ${{ github.repository_owner }}
    WEB_IMAGE: cicd-web
    API_IMAGE: cicd-api

jobs:
  prepare:
    name: Resolve deployment artifacts
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' ||
      github.event_name == 'workflow_dispatch'

    outputs:
      image-sha: ${{ steps.resolve_sha.outputs.image_sha }}
      web-image: ${{ steps.images.outputs.web-image }}
      api-image: ${{ steps.images.outputs.api-image }}

    steps:
      - name: Resolve image references
        id: resolve_sha
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "workflow_run" ]; then
              IMAGE_SHA="${{ github.event.workflow_run.head_sha }}"
          else
              IMAGE_SHA="${{ inputs.image_sha }}"
          fi
          echo "Using image SHA: ${IMAGE_SHA}"
          echo "image-sha=${IMAGE_SHA}" >> "$GITHUB_OUTPUT"

      - name: Resolve image references
        id: images
        shell: bash
        run: |
          IMAGE_SHA="${{ steps.resolve_sha.outputs.image_sha }}"
          echo \
            "web-image=${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.WEB_IMAGE }}:sha-${IMAGE_SHA}" \
            >> "$GITHUB_OUTPUT"

          echo \
            "api-image=${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.API_IMAGE }}:sha-${IMAGE_SHA}" \
            >> "$GITHUB_OUTPUT"

      - name: Show deployment artifacts
        run: |
          echo "Image SHA:"
          echo "${{ steps.resolve_image_ref.image_sha }}"
          
          echo "WEB:"
          echo "${{ steps.images.outputs.web-image }}"

          echo "API:"
          echo "${{ steps.images.outputs.api-image }}"



  deploy-development:
    name: Deploy development
    needs:
      - prepare
    runs-on: ubuntu-latest
    environment:
      name: development

    concurrency:
      group: development-${{ needs.prepare.outputs.image-sha }}
      cancel-in-progress: true

    steps:
      - name: Show environment
        run: |
          echo "Environment:"
          echo "${{ vars.APP_ENV }}"

      - name: Show development artifact
        run: |
          echo "Image SHA:"
          echo "${{ needs.prepare.outputs.image-sha }}"
          echo "Deploying WEB:"
          echo "${{ needs.prepare.outputs.web-image }}"
          echo "Deploying API:"
          echo "${{ needs.prepare.outputs.api-image }}"

      - name: Deploy to development
        run: |
          echo "Deploying To development environment..."


  verify-development:
    name: Verify development
    needs:
      - deploy-development
    runs-on: ubuntu-latest
    environment:
      name: development
    steps:
      - name: Verify artifact identity
        run: |
          echo "Verifying:"
          echo "${{ needs.prepare.outputs.image-sha }}"
          echo "Environment:"
          echo "${{ vars.APP_ENV }}"
          echo "Verifying deployment to development environment..."
      - name: Run smoke tests
        run: |
          echo "Running smoke tests against development environment..."

  deploy-staging:
    name: Deploy staging
    if: |
        github.event_name == 'workflow_dispatch'
    needs:
      - prepare
      - verify-development
    runs-on: ubuntu-latest

    environment:
      name: staging

    steps:
      - name: Show environment
        run: |
          echo "Environment:"
          echo "${{ vars.APP_ENV }}"


      - name: Show staging artifact
        run: |
          echo "Image SHA:"
          echo "${{ needs.prepare.outputs.image-sha }}"
          echo "Promoting WEB:"
          echo "${{ needs.prepare.outputs.web-image }}"
          echo "Promoting API:"
          echo "${{ needs.prepare.outputs.api-image }}"
          

      - name: Deploy to staging
        run: |
          echo "Deploying To staging environment..."
          

  verify-staging:
    name: Verify staging
    needs:
      - deploy-staging
    runs-on: ubuntu-latest

    environment:
      name: staging

    steps:
      - name: Verify deployment
        run: |
          echo "Environment:"
          echo "${{ vars.APP_ENV }}"
          echo "Verifying deployment to staging environment..."


  deploy-production:
    name: Deploy production

    if:
      github.event_name == 'workflow_dispatch'

    needs:
      - prepare
      - verify-staging

    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Show production artifact
        run: |
          echo "Promoting WEB:"
          echo "${{ needs.prepare.outputs.web-image }}"

          echo "Promoting API:"
          echo "${{ needs.prepare.outputs.api-image }}"
      - name: Deploy to production
        run: |
          echo "Deploying To production environment..."
          
          
          

  verify-production:
    name: Verify production
    needs:
      - deploy-production
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Verify deployment
        run: |
          echo "Environment:"
          echo "${{ vars.APP_ENV }}"
          echo "Verifying deployment to production environment..."