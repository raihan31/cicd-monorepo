name: CI/CD Docker Build and Test

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  lint:
    name: Lint affected projects
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set Nx comparison SHAs
        uses: nrwl/nx-set-shas@v4

      - name: Show affected projects
        run: npx nx show projects --affected

      - name: Lint affected projects
        run: npx nx affected -t lint --parallel=3



  test:
    name: Test affected projects
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set Nx comparison SHAs
        uses: nrwl/nx-set-shas@v4

      - name: Test affected projects with coverage
        run: >
          npx nx affected
          -t test
          --coverage
          --ci
          --runInBand

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.sha }}
          path: test-results
          if-no-files-found: warn
          retention-days: 7

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports-${{ github.sha }}
          path: coverage
          if-no-files-found: warn
          retention-days: 7



  build:
    name: Build affected projects
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set Nx comparison SHAs
        uses: nrwl/nx-set-shas@v4

      - name: Build affected projects
        run: npx nx affected -t build --parallel=3

      - name: Show build output
        run: |
          echo "Generated build files:"
          find dist -maxdepth 4 -type f | head -100


      - name: Upload Angular build
        uses: actions/upload-artifact@v4
        with:
          name: angular-web-${{ github.sha }}
          path: dist/apps/web
          if-no-files-found: warn
          retention-days: 7

      - name: Upload NestJS build
        uses: actions/upload-artifact@v4
        with:
          name: nestjs-api-${{ github.sha }}
          path: dist/apps/api
          if-no-files-found: warn
          retention-days: 7



  quality-gate:
    name: CI quality gate
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
      - build

    steps:
      - name: Confirm all checks passed
        run: echo "Lint, tests, and builds completed successfully."